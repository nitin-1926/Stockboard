name: Cron indmoney-sync

on:
  schedule:
    - cron: "15 21 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-indmoney-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/indmoney-sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 320 -X POST "$APP_URL/api/cron/indmoney-sync" -H "Authorization: Bearer $CRON_SECRET"
