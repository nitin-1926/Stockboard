name: Cron prices-intraday

on:
  # UTC. NSE every 5 min 09:15-15:30 IST (03:45-10:00 UTC); NYSE every 15 min, wide enough
  # for both NY offsets. The job skips whichever market isMarketOpen() says is closed.
  # Mirrors SCHEDULES in src/lib/jobs/schedule.ts.
  schedule:
    - cron: "45-55/5 3 * * 1-5"
    - cron: "*/5 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-prices-intraday
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/prices-intraday
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 320 -X POST "$APP_URL/api/cron/prices-intraday" -H "Authorization: Bearer $CRON_SECRET"
