name: Cron kite-sync

on:
  # UTC. Hourly 09:30-15:30 IST, 15:45 IST after close, 17:00 IST self-heal.
  # Mirrors SCHEDULES in src/lib/jobs/schedule.ts.
  schedule:
    - cron: "0 4-10 * * 1-5"
    - cron: "15 10 * * 1-5"
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-kite-sync
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/kite-sync
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 320 -X POST "$APP_URL/api/cron/kite-sync" -H "Authorization: Bearer $CRON_SECRET"
