name: Cron kite-login

on:
  schedule:
    - cron: "30 2 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: cron-kite-login
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/kite-login
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --max-time 320 -X POST "$APP_URL/api/cron/kite-login" -H "Authorization: Bearer $CRON_SECRET"
